name: Deploy Vue.js -dashboard

on:
  # push:
  #   branches:
  #     - main
  #     - dev
  pull_request:
    types: [closed]
    branches:
      - dev

jobs:
  build-and-deploy:
    # push trigger 目前是關閉的（見上方被註解的 on.push），
    # 因此這裡只需判斷 PR 是否真的被合併；原本的 github.event_name == 'push'
    # 是永遠不成立的死條件。
    if: github.event.pull_request.merged == true
    runs-on: [self-hosted]
    
    steps:
    - name: Checkout Vue.js project
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.ref_name }}
    
    - name: Setup Node.js for Vue 3 + Vite
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install Vue.js dependencies
      run: |
        Write-Host "Installing Vue.js 3 + Composition API dependencies..."
        npm ci
      shell: powershell
    
    - name: Verify (typecheck + lint)
      run: |
        Write-Host "Running typecheck and lint before build..."
        npm run typecheck
        npm run lint
      shell: powershell

    - name: Build Vue.js Dashboard with Vite
      run: |
        Write-Host "Building Vue.js 3 + Composition API WIP Dashboard..."
        npm run build
        
        if (Test-Path "dist/index.html") {
          Write-Host "SUCCESS: Vue.js Dashboard build completed"
          Write-Host "Components: Dashboard + FilterDropdown + DataChart"
        } else {
          Write-Host "ERROR: Vue.js build failed"
          exit 1
        }
      shell: powershell
    
    - name: Deploy Vue.js Dashboard
      run: |
        Write-Host "Deploying Vue.js 3 + Composition API Dashboard..."
        
        # 停止現有容器
        docker-compose down --remove-orphans --timeout 30
        
        # 建置並啟動 Vue.js Dashboard
        docker-compose build --no-cache
        docker-compose up -d
        
        Write-Host "Vue.js Dashboard deploent completed"
      shell: powershell
    
    - name: Verify Vue.js Dashboard
      run: |
        Write-Host "Verifying Vue.js Dashboard..."
        Start-Sleep -Seconds 30
        
        try {
          $response = Invoke-WebRequest -Uri "http://localhost:5015" -UseBasicParsing -TimeoutSec 15
          if ($response.StatusCode -eq 200) {
            Write-Host "SUCCESS: Vue.js 3 Dashboard is running!"
            Write-Host "Dashboard URL: http://localhost:5015"
            Write-Host "Tech Stack: Vue.js 3 + Composition API + Vue Router 4 + Vite + Tailwind CSS"
          }
        } catch {
          Write-Host "WARNING: Dashboard verification failed"
          Write-Host "Container logs:"
          docker logs realtime-kanban1 --tail=10
        }
      shell: powershell
    
    - name: Cleanup Docker resources
      run: |
        # 只清理這次建置產生的懸空映像。
        # 原本是 `docker system prune -f --volumes`，那會刪掉同一台 self-hosted
        # runner 上所有未使用的映像、網路與「具名 volume」——包含其他專案的資料。
        Write-Host "Removing dangling images created by this build..."
        docker image prune -f
      shell: powershell
